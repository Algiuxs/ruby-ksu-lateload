name: Build KernelSU Kernel Module for Ruby (4.19)

on:
  workflow_call:
    inputs:
      expected_size2:
        description: 'Second expected signature size (for PR builds)'
        required: false
        default: ''
        type: string
      expected_hash2:
        description: 'Second expected signature hash (for PR builds)'
        required: false
        default: ''
        type: string

jobs:
  build-kernelsu-ko:
    name: Build kernelsu.ko for ruby (4.19, Android 14)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Clone Xiaomi ruby kernel (4.19)
        run: |
          git clone --depth 1 --branch ruby-s-oss https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git ruby-kernel

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r29

      - name: Build kernelsu.ko for ruby
        env:
          EXPECTED_SIZE2: ${{ inputs.expected_size2 }}
          EXPECTED_HASH2: ${{ inputs.expected_hash2 }}
          NDK_PATH: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          set -euxo pipefail

          git config --global --add safe.directory "$GITHUB_WORKSPACE"

          export KBUILD_OUTPUT="$GITHUB_WORKSPACE/out/ruby"
          mkdir -p "$KBUILD_OUTPUT"

          cd ruby-kernel

          # Configure the same output tree we will later compile with
          make ARCH=arm64 O="$KBUILD_OUTPUT" ruby_user_defconfig
          scripts/config --disable CONFIG_LOCALVERSION_AUTO
          scripts/config --set-str CONFIG_LOCALVERSION "-ge6429b82e599"

          # Generate the kernel headers and generated UAPI files in the O= tree
          make ARCH=arm64 O="$KBUILD_OUTPUT" prepare
          make ARCH=arm64 O="$KBUILD_OUTPUT" modules_prepare

          # Optional sanity check: make sure these generated headers exist
          test -f "$KBUILD_OUTPUT/arch/arm64/include/generated/asm/types.h" || {
            echo "Missing generated asm/types.h in $KBUILD_OUTPUT"
            find "$KBUILD_OUTPUT" -path '*asm/types.h' -o -path '*linux/version.h' | head -50
            exit 1
          }

          cd ..

          echo "=== Building kernelsu.ko for ruby (4.19, Android 14) ==="

          EXTRA_ARGS=""
          if [ -n "$EXPECTED_SIZE2" ] && [ -z "$EXPECTED_HASH2" ]; then
            echo "ERROR: expected_hash2 must be provided when expected_size2 is set."
            exit 1
          fi
          if [ -z "$EXPECTED_SIZE2" ] && [ -n "$EXPECTED_HASH2" ]; then
            echo "ERROR: expected_size2 must be provided when expected_hash2 is set."
            exit 1
          fi
          if [ -n "$EXPECTED_SIZE2" ]; then
            EXTRA_ARGS="KSU_EXPECTED_SIZE2=$EXPECTED_SIZE2 KSU_EXPECTED_HASH2=$EXPECTED_HASH2"
          fi

          export PATH="$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"

          make -C ruby-kernel M="$PWD/kernel" src="$PWD/kernel" O="$KBUILD_OUTPUT" \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-android- \
            LLVM=1 LLVM_IAS=1 \
            CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm \
            OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip \
            CONFIG_KSU=m \
            CONFIG_KSU_LEGACY_4_19=y \
            KSU_VERSION_OVERRIDE=32548 \
            $EXTRA_ARGS \
            modules -j"$(nproc)"

      - name: Patch vermagic
        run: |
          python3 .github/scripts/patch_ver.py out/ruby/kernelsu.ko "4.19.191-ge6429b82e599 SMP preempt mod_unload modversions aarch64" out/ruby/kernelsu.ko

      - name: Verify vermagic patch
        run: |
          python3 .github/scripts/verify_patch.py out/ruby/kernelsu.ko "4.19.191-ge6429b82e599 SMP preempt mod_unload modversions aarch64" 0xf0c01ec5 module_layout

      - name: Patch CRC
        run: |
          python3 .github/scripts/patch_crc.py out/ruby/kernelsu.ko 0xf0c01ec5 module_layout
          cp out/ruby/kernelsu_patched.ko out/ruby/ruby_kernelsu.ko

      - name: Verify CRC patch
        run: |
          python3 .github/scripts/verify_patch.py out/ruby/ruby_kernelsu.ko "4.19.191-ge6429b82e599 SMP preempt mod_unload modversions aarch64" 0xf0c01ec5 module_layout

      - name: Upload kernelsu.ko artifact
        uses: actions/upload-artifact@v7
        with:
          name: ruby-lkm
          path: out/ruby/ruby_kernelsu.ko